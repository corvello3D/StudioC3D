<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudioC3D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudioC3D">
<meta name="robots" content="noindex">
<style>
:root{--bg:#eceff3;--card:#fff;--fg:#1e2533;--muted:#5d6676;--line:#d5dae2;--btn:#1e2533;--btnfg:#fff;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1b212b;--fg:#e8ebf0;--muted:#9aa3b2;--line:#2e3644;--btn:#e8ebf0;--btnfg:#12161d;--bad:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px 24px;display:grid;gap:14px;box-shadow:0 10px 30px rgb(0 0 0 / .08)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo img{width:52px;height:52px;border-radius:12px}
.logo b{font-size:1.25rem;letter-spacing:.01em}
.logo span{display:block;font-size:.85rem;color:var(--muted)}
label{display:grid;gap:6px;font-size:.88rem;font-weight:600}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--fg)}
input:focus{outline:none;border-color:var(--fg)}
.row{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:400}
.row input{width:20px;height:20px;accent-color:var(--btn)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font:inherit;font-size:.8rem;padding:8px;cursor:pointer}
.pw input{padding-right:64px}
button.go{font:inherit;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--btn);color:var(--btnfg);cursor:pointer;margin-top:4px}
button.go:disabled{opacity:.6}
.err{color:var(--bad);font-size:.88rem;margin:0;min-height:1.2em}
.wait{color:var(--muted);text-align:center}
</style>
</head><body>
<main>
  <p class="wait" id="wait">Abrindo…</p>
  <form id="f" hidden autocomplete="on">
    <div class="logo"><img src="icon-192.png" alt=""><div><b>StudioC3D</b><span>Corvello 3D · acesso restrito</span></div></div>
    <label>Usuário<input id="u" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Senha<span class="pw"><input id="p" type="password" name="password" autocomplete="current-password" required><button type="button" id="eye" aria-label="Mostrar senha">Mostrar</button></span></label>
    <label class="row"><input id="keep" type="checkbox" checked>Manter conectado neste aparelho</label>
    <p class="err" id="err" role="alert"></p>
    <button class="go" id="go" type="submit">Entrar</button>
  </form>
</main>

  $("eye").onclick = function () { var p = $("p"), show = p.type === "password"; p.type = show ? "text" : "password"; this.textContent = show ? "Ocultar" : "Mostrar"; this.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha"); };
  $("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    var u = $("u").value.trim().toLowerCase(), p = $("p").value;
    if (!u || !p) return;
    $("go").disabled = true; $("go").textContent = "Conferindo…"; $("err").textContent = "";
    try {
      var salt = b64(SALT), s2 = new Uint8Array(salt.length + enc.encode(u).length); s2.set(salt); s2.set(enc.encode(u), salt.length);
      var base = await crypto.subtle.importKey("raw", enc.encode(p), "PBKDF2", false, ["deriveBits"]);
      var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: s2, iterations: ITER }, base, 256);
      var key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
      try { await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB).slice(0, 12), additionalData: enc.encode("studioc3d") }, key, b64(BLOB).slice(12)); }
      catch (x) { throw new Error("senha"); }
      if ($("keep").checked) { var raw = new Uint8Array(bits), s = ""; for (var i = 0; i < raw.length; i++) s += String.fromCharCode(raw[i]); store(KEYNAME, btoa(s)); } else store(KEYNAME, null);
      await openWith(key);
    } catch (x) {
      $("go").disabled = false; $("go").textContent = "Entrar";
      $("err").textContent = x && x.message === "senha" ? "Usuário ou senha incorretos." : "Não consegui abrir o app. Tente de novo.";
      $("p").select();
    }
  });
  var saved = load(KEYNAME);
  if (saved) {
    crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]).then(openWith).catch(function () { store(KEYNAME, null); showForm(""); });
  } else showForm("");
})();
</script>
